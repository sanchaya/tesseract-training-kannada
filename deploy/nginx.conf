# nginx configuration for trainocr.sanchaya.net
#
# Prerequisites:
#   1. Node.js app running via PM2 on port 3000
#   2. SSL certificate (Let's Encrypt recommended):
#        certbot --nginx -d trainocr.sanchaya.net
#
# Place this file at: /etc/nginx/sites-available/trainocr.sanchaya.net
# Then:
#   ln -s /etc/nginx/sites-available/trainocr.sanchaya.net \
#         /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name trainocr.sanchaya.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trainocr.sanchaya.net;

    # SSL — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/trainocr.sanchaya.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trainocr.sanchaya.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options       SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy       strict-origin-when-cross-origin;

    # Access control — restrict to trusted IPs if this is internal
    # allow 203.0.113.0/24;
    # deny  all;

    # Gzip
    gzip on;
    gzip_types text/plain text/html text/css application/javascript
               application/json application/octet-stream;
    gzip_comp_level 5;

    # Large file uploads (scans, traineddata files)
    client_max_body_size 200M;

    # SSE (training log stream) — disable buffering
    proxy_buffering off;

    # Reverse proxy to Node.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep SSE connections open (training log stream)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Serve traineddata files efficiently (large binary files)
    location /tessdata/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_buffering    on;
        proxy_buffer_size  128k;
        proxy_buffers      8 256k;
    }

    # Static assets — cache aggressively
    location ~* \.(js|css|png|ico|woff2?)$ {
        proxy_pass    http://127.0.0.1:3000;
        expires       30d;
        add_header    Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/trainocr.access.log;
    error_log  /var/log/nginx/trainocr.error.log;
}
