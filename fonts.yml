# ════════════════════════════════════════════════════════════════
# fonts.yml — Karnata Font Registry for kan_hist Tesseract training
# ════════════════════════════════════════════════════════════════
#
# Each entry here produces rendered training images that are combined
# into a single kan_hist.traineddata model.
#
# To add a new font:
#   1. Append an entry below
#   2. Run: python3 corpus/render-corpus.py
#   3. Run: ./scripts/02-make-lstmf.sh  (re-generates list.txt)
#   4. Run: ./scripts/03-train.sh       (continues from last checkpoint)
#
# Fields:
#   id          - Short identifier (used for file naming in rendered/)
#   name        - Human-readable font family name
#   repo        - GitHub URL; fonts are cloned into fonts/<id>/
#   font_dir    - Subdirectory inside repo containing font files
#   font_files  - Font filenames to render with (.ttf or .otf)
#   degrade     - true = add ink-spread simulation (historical/letterpress)
#                 false = clean rendering (modern digital fonts)
#   max_pages   - Training image count per font style
#   font_features - Optional OpenType feature string. Currently EMPTY for every
#                 font, and that is deliberate.
#
#                 'aalt' was previously set on GTN and WMP on the theory that
#                 their ottu forms lived there. Measured Aug 2026: aalt maps base
#                 consonants to alternate (*_v) forms, so running text renders
#                 with a halant on nearly every consonant and vowel signs are
#                 dropped — ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ came out as ವದ್ಯಥ್ರಗಳಿಗ. Conjuncts form
#                 correctly WITHOUT it once the Indic features are left to
#                 HarfBuzz's shaper (see corpus/shaping_render.py).
#
#                 The aalt setting was compensating for a different bug — the
#                 shaper being handed a forced Indic feature list. That is fixed;
#                 aalt is no longer needed and is actively harmful.
#                 See docs/CONJUNCT_RENDERING.md §10.
# ════════════════════════════════════════════════════════════════

fonts:

  # ── KarnataGTN ───────────────────────────────────────────────
  # Modern typeface, G.T. Narayana Rao handwriting style.
  # 6 static weights (TTF preferred; OTF also available).
  - id: kan_gtn
    name: "Karnata GTN"
    description: "Kannada typeface in G.T. Narayana Rao style (Sanchaya)"
    repo: https://github.com/sanchaya/karnata-gtn-typeface
    font_dir: fonts/ttf
    font_files:
      - KarnataGTN-Regular.ttf
      - KarnataGTN-Medium.ttf
      - KarnataGTN-SemiBold.ttf
      - KarnataGTN-Bold.ttf
      - KarnataGTN-ExtraBold.ttf
      - KarnataGTN-Black.ttf
    degrade: false
    max_pages: 600
    # NO font_features. 'aalt' was previously enabled here — see the correction
    # in docs/CONJUNCT_RENDERING.md §10. It maps base consonants to their
    # alternate (*_v) forms, which renders running text with a halant on nearly
    # every consonant and drops vowel signs. Conjuncts form correctly without it
    # once the Indic features are left to HarfBuzz's shaper.

  # ── Karnata German Mission Press ─────────────────────────────
  # Historical letterpress revival, German Mission Press, Mangaluru.
  # TTF and OTF both available — TTF used for training.
  - id: kan_gmp
    name: "Karnata German Mission Press"
    description: "Revival of German Mission Press Kannada typeface, Mangaluru"
    repo: https://github.com/sanchaya/karnata-german-mission-press-typeface
    font_dir: fonts/ttf
    font_files:
      - KarnataGermanMissionPressTypeface.ttf
    degrade: true
    max_pages: 600

  # ── Karnata Wesleyan Mission Press ───────────────────────────
  # Historical letterpress revival, Wesleyan Mission Press.
  # TTF and OTF both available — TTF used for training.
  - id: kan_wmp
    name: "Karnata Wesleyan Mission Press"
    description: "Revival of Wesleyan Mission Press Kannada typeface, Bengaluru/Mangaluru"
    repo: https://github.com/sanchaya/karnata-wesleyan-mission-press-typeface
    font_dir: fonts/ttf
    font_files:
      - KarnataWesleyanMissionPress.ttf
    degrade: true
    max_pages: 600
    # NO font_features — same correction as GTN. See docs/CONJUNCT_RENDERING.md §10.

  # ── Karnata F Kittel ─────────────────────────────────────────
  # Basel Mission Press, Mangalore (1830-1900). Named after F. Kittel.
  # OTF only (no TTF version exists).
  - id: kan_kittel
    name: "Karnata F Kittel"
    description: "Revival of Basel Mission Press Mangalore typeface (1830-1900)"
    repo: https://github.com/sanchaya/karnata-f-kittel-font
    font_dir: fonts
    font_files:
      - KarnataFKittel.otf
    degrade: true
    max_pages: 600

  # ── ADD NEW FONTS BELOW ───────────────────────────────────────
  # Copy any entry above and fill in the fields.
  # After adding, re-run render-corpus.py → 02-make-lstmf.sh → 03-train.sh
